[tool.poetry]
name = "mdb_api_layer"
version = "0.1.0"
description = "TMDB API testing layer"
authors = ["Pratik Gundlupet Venkatesh <pratikgv1@.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.0"
python-dotenv = "^1.0"
jsonschema = "^4.0"
pyyaml = "^6.0.3"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-html = "^4.1"
sphinx = "^7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
generate_report_on_test = true