[tool.poetry]
name = "mdb_api_layer"
version = "0.1.0"
description = "TMDB API testing layer"
authors = ["Pratik Gundlupet Venkatesh <pratikgv1@.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.0"
python-dotenv = "^1.0"
pyyaml = "^6.0.3"
loguru = "^0.7.0"
pytest-html-report-merger = "^0.1.3"
pydantic = "^2.12.5"
groq = "^1.1.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-html = "^4.1"
sphinx = "^7.0"
pytest-order = "^1.3.0"
pact-python = "^3.2"
allure-pytest = "^2.15"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
generate_report_on_test = true
markers = [
    "contract: marks tests as contract tests (deselect with '-m \"not contract\"')"
]
