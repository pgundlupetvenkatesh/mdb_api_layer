[tool.poetry]
name = "mdb_api_layer"
version = "0.1.0"
description = "TMDB API testing layer"
authors = ["Pratik Gundlupet Venkatesh <pratikgv1@.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.0"
python-dotenv = "^1.0"
pyyaml = "^6.0.3"
loguru = "^0.7.0"
pytest-html-report-merger = "^0.1.3"
pydantic = "^2.12.5"
groq = "^1.1.2"
mcp = "^1.27.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-html = "^4.1"
sphinx = "^7.0"
pytest-order = "^1.3.0"
pact-python = "^3.2"
allure-pytest = "^2.15"
pytest-rerunfailures = "^16.3"
locust = "^2.45.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Exclude the offline unit tests from the default run so `pytest tests/` stays
# the TMDB API suite (integration + contract). Opt in with `-m unit` (a
# command-line -m replaces this default rather than combining with it).
addopts = "-m 'not unit'"
generate_report_on_test = true
markers = [
    "contract: marks tests as contract tests (deselect with '-m \"not contract\"')",
    "unit: marks fast offline unit tests that don't hit the TMDB API (select with '-m unit', deselect with '-m \"not unit\"')"
]
