name: Docker API Tests

# On every push to main or PR updates
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Grant GITHUB_TOKEN the permissions required for Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    # Clone your repo into the runner
    - name: Checkout code
      uses: actions/checkout@v4

    # Enabling Docker Buildx for improved caching
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Cache Docker layers between workflow runs
    # Key is based on Dockerfile + poetry.lock — if neither changes,
    # the cache is reused and Docker skips rebuilding unchanged layers.
    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-docker-${{ hashFiles('Dockerfile', 'poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-docker-

    # Build the Docker image from your Dockerfile
    # --cache-from: read cached layers from previous runs
    # --cache-to: write new layers to cache for next run
    # --load: make the image available to `docker run`
    - name: Build Docker image
      run: |
        docker buildx build \
          --cache-from type=local,src=/tmp/.buildx-cache \
          --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
          --load \
          -t mdb-api-tests .

    # Create the report directory on the runner's filesystem
    # (needed for the volume mount — Docker won't create it automatically)
    - name: Create report directories
      run: |
        mkdir -p report
        mkdir -p allure-results

    # Write secrets into a temporary .env file for docker compose.
    # docker-compose.yml reads env_file: .env, so secrets are passed
    # as environment variables without baking them into the image.
    - name: Create .env from secrets
      run: |
        echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env
        echo "TMDB_SESSION_ID=${{ secrets.TMDB_SESSION_ID }}" >> .env
        echo "TMDB_AUTH_TOKEN=${{ secrets.TMDB_AUTH_TOKEN }}" >> .env
        echo "TMDB_USER_ACCESS_TOKEN=${{ secrets.TMDB_USER_ACCESS_TOKEN }}" >> .env
        echo "TMDB_REQ_TOKEN=${{ secrets.TMDB_REQ_TOKEN }}" >> .env
        echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
        echo "AI_ANALYSIS_ENABLED=${{ vars.AI_ANALYSIS_ENABLED }}" >> .env

    # Run integration and contract tests in parallel using docker compose.
    # --no-build: skip building since the image was already built by buildx above.
    # Both services run simultaneously and write separate reports to ./report.
    # Exit code is non-zero if any service fails; captured so the workflow
    # can continue to merge and deploy the report before failing.
    - name: Run Tests in Docker
      id: tests
      run: |
        EXIT_CODE=0
        docker compose up --no-build || EXIT_CODE=$?
        echo "TEST_EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV

    # Rotate the Docker cache to prevent unbounded growth
    # Runs even if tests fail (if: always())
    - name: Move Docker cache
      if: always()
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

    # List report files for debugging — helps verify both test
    # containers produced their HTML before the merge step runs.
    # Fix permissions on Docker-created directories. Docker runs as root,
    # so mounted volumes are root-owned. The runner user needs write access for subsequent steps.
    - name: List report files & Fix Docker output permissions
      if: always()
      run: |
        sudo chown -R $USER:$USER allure-results/ report/
        ls -la report/
        ls -la allure-results/

    # Merge individual HTML reports into a single combined report.
    # Runs inside the Docker image because pytest-html-report-merger
    # is installed there (not on the runner).
    # Only runs if both report files exist (both containers succeeded).
    - name: Merge Reports
      if: always() && github.event_name == 'push'
      run: |
        echo "=== Checking for report files ==="
        ls -la report/*.html || echo "No HTML files found"
        if [ -f report/tmdb_non_contract_report.html ] && [ -f report/tmdb_contract_report.html ]; then
          echo "Both reports found — merging..."
          docker run --rm \
            -v ${{ github.workspace }}/report:/app/report \
            mdb-api-tests \
            pytest-html-report-merger \
              --out /app/report/merged_tmdb_full_report.html \
              /app/report/tmdb_non_contract_report.html \
              /app/report/tmdb_contract_report.html
          echo "=== Merge complete — verifying output ==="
          ls -la report/merged_tmdb_full_report.html || echo "::error::Merged report was NOT created"
        else
          echo "::warning::One or both report files missing — skipping merge"
          ls -la report/
        fi

    # Publish the HTML report to GitHub Pages
    # - Copies report/ contents to the gh-pages branch under /report
    # - keep_files: true means previous reports are preserved (appended)
    # - Runs even if tests fail so you can see the failure report
    # - Only deploys on push (PR tokens cannot write to gh-pages)
    - name: Deploy report to GitHub Pages
      if: always() && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./report # Deploy report directory to the remote GHP branch
        destination_dir: report # Destination subDir on a publishing branch
        keep_files: true

    # Write Allure executor metadata for CI context
    # Creates executor.json directly inside each allure-results subdirectory
    # so Allure knows which CI build produced the results.
    - name: Write Allure executor info
      if: always()
      run: |
        for dir in allure-results/integration allure-results/contract; do
          if [ -d "$dir" ]; then
            echo "Writing executor.json to $dir"
            cat > "$dir/executor.json" <<'EXECUTOR'
        {
          "name": "GitHub Actions",
          "type": "github",
          "buildName": "${{ github.workflow }} #${{ github.run_number }}",
          "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          "reportUrl": "https://pgundlupetvenkatesh.github.io/mdb_api_layer/allure/index.html"
        }
        EXECUTOR
          fi
        done

    # Install Allure CLI on the runner
    - name: Install Allure CLI
      if: always() && github.event_name == 'push'
      run: |
        curl -sL https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.tgz | tar -xz
        echo "$PWD/allure-2.30.0/bin" >> $GITHUB_PATH

    # Merge allure-results from both containers into one directory,
    # then download previous history from gh-pages for trend charts.
    # Order matters: merge results first, then add history on top.
    - name: Prepare Allure results & history
      if: always() && github.event_name == 'push'
      run: |
        # 1. Merge results from both test containers
        mkdir -p allure-results-merged
        cp -r allure-results/integration/* allure-results-merged/ 2>/dev/null || true
        cp -r allure-results/contract/* allure-results-merged/ 2>/dev/null || true
        echo "=== Merged allure results ==="
        ls -la allure-results-merged/
        
        # 2. Download previous Allure history from gh-pages (for trend data)
        git fetch origin gh-pages --depth=1 || true
        mkdir -p allure-results-merged/history
        for file in history-trend.json history.json categories-trend.json duration-trend.json retry-trend.json; do
          git show "origin/gh-pages:allure/history/$file" > "allure-results-merged/history/$file" 2>/dev/null || true
        done
        echo "=== Allure history files ==="
        ls -la allure-results-merged/history/ || echo "No history yet (first run)"

    # Generate static Allure report from the merged results + history.
    - name: Generate Allure Report
      if: always() && github.event_name == 'push'
      run: allure generate allure-results-merged -o allure-report --clean

    # Deploy Allure report to GitHub Pages under /allure
    - name: Deploy Allure report to GitHub Pages
      if: always() && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
        destination_dir: allure
        keep_files: true

    # Fail the workflow if tests failed (after report is deployed)
    - name: Check test results
      if: always()
      run: |
        if [ -n "$TEST_EXIT_CODE" ] && [ "$TEST_EXIT_CODE" -ne 0 ]; then
          echo "Tests failed with exit code $TEST_EXIT_CODE"
          exit $TEST_EXIT_CODE
        fi