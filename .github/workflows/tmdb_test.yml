name: Docker API Tests

# On every push or PR to main/master
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Grant GITHUB_TOKEN the permissions required for Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    # Clone your repo into the runner
    - name: Checkout code
      uses: actions/checkout@v4

    # Enabling Docker Buildx for improved caching
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Cache Docker layers between workflow runs
    # Key is based on Dockerfile + poetry.lock — if neither changes,
    # the cache is reused and Docker skips rebuilding unchanged layers.
    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-docker-${{ hashFiles('Dockerfile', 'poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-docker-

    # Build the Docker image from your Dockerfile
    # --cache-from: read cached layers from previous runs
    # --cache-to: write new layers to cache for next run
    # --load: make the image available to `docker run`
    - name: Build Docker image
      run: |
        docker buildx build \
          --cache-from type=local,src=/tmp/.buildx-cache \
          --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
          --load \
          -t mdb-api-tests .

    # Create the report directory on the runner's filesystem
    # (needed for the volume mount — Docker won't create it automatically)
    - name: Create report directory
      run: mkdir -p report

    # Run tests inside the container and capture exit code.
    # -e: pass each secret as an environment variable (never stored in image)
    # -v: mount the runner's report/ folder into the container's /app/report
    #     so the HTML report is written to the runner's filesystem
    # Even if tests fail, we continue so the report gets deployed.
    # The exit code is saved to GITHUB_ENV and checked in the final step.
    - name: Run Tests in Docker
      id: tests
      run: |
        EXIT_CODE=0
        docker run --rm \
          -e TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} \
          -e TMDB_SESSION_ID=${{ secrets.TMDB_SESSION_ID }} \
          -e TMDB_AUTH_TOKEN=${{ secrets.TMDB_AUTH_TOKEN }} \
          -e TMDB_USER_ACCESS_TOKEN=${{ secrets.TMDB_USER_ACCESS_TOKEN }} \
          -e TMDB_REQ_TOKEN=${{ secrets.TMDB_REQ_TOKEN }} \
          -v ${{ github.workspace }}/report:/app/report \
          mdb-api-tests || EXIT_CODE=$?
        echo "TEST_EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV

    # Rotate the Docker cache to prevent unbounded growth
    # Runs even if tests fail (if: always())
    - name: Move Docker cache
      if: always()
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

    # Publish the HTML report to GitHub Pages
    # - Copies report/ contents to the gh-pages branch under /report
    # - keep_files: true means previous reports are preserved (appended)
    # - Runs even if tests fail so you can see the failure report
    - name: Deploy report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./report
        destination_dir: report
        keep_files: true

    # Fail the workflow if tests failed (after report is deployed)
    - name: Check test results
      if: always()
      run: |
        if [ -n "$TEST_EXIT_CODE" ] && [ "$TEST_EXIT_CODE" -ne 0 ]; then
          echo "Tests failed with exit code $TEST_EXIT_CODE"
          exit $TEST_EXIT_CODE
        fi