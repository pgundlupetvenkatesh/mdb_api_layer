defaults:
  exp_max_elp_secs: 5 # Applied to ALL valid AND invalid test cases
  exp_content_type: 'application/json'
  exp_get_req_method: 'GET'
  exp_post_req_method: 'POST'
  exp_del_req_method: 'DELETE'
  exp_put_req_method: 'PUT'

get_movie_details:
  defaults:
    valid:
        status_code: 200  # Only applied to valid cases
        reason: 'OK'
    invalid:
        status_code: 404  # Only applied to invalid cases
        reason: 'Not Found'
  valid:
    - movie_id: "$random_movie_id" # First list item (index 0)
    - movie_id: "$random_movie_id" # Second list item (index 1)
    - movie_id: "$random_movie_id"
  invalid:
    - movie_id: 0
      expected_message: "Invalid id: The pre-requisite id is invalid or not found."
    - movie_id: -1
      expected_message: "Invalid id: The pre-requisite id is invalid or not found."
    - movie_id: 9999999999
      expected_message: "The resource you requested could not be found."

popular_movies:
  defaults:
    valid:
      status_code: 200
      reason: 'OK'
      exp_page: 1 # client defaults page to 1; cases that send a page override this
    invalid:
      status_code: 400
      reason: 'Bad Request'
  valid:
    - query_param: { "language": "en-US" }
    - query_param: { "page": 2 }
      exp_page: 2
  invalid:
    - query_param: { "page": -1 }
      expected_message: "Invalid page: Pages start at 1 and max at 500. They are expected to be an integer."

search_movies:
  defaults:
    valid:
      status_code: 200
      reason: 'OK'
      exp_page: 1 # client defaults page to 1; cases that send a page override this
    empty: # Missing/empty/no-match query returns 200 with empty results, not an error
      status_code: 200
      reason: 'OK'
    invalid:
      status_code: 400
      reason: 'Bad Request'
  valid: # One case per supported query param + all combined; page defaults to 1 in the client
    - query_param: { "query": "Batman" }
    - query_param: { "query": "Batman", "page": 2 }
      exp_page: 2
    - query_param: { "query": "Batman", "language": "en-US" }
    - query_param: { "query": "Batman", "include_adult": "true" }
    - query_param: { "query": "Batman", "region": "US" }
    - query_param: { "query": "Batman", "year": "1989" }
    - query_param: { "query": "Batman", "primary_release_year": "1989" }
    - query_param: { "query": "Batman", "language": "en-US", "include_adult": "true", "region": "US",
                     "year": "1989", "primary_release_year": "1989", "page": 1 }
  empty:
    - query_param: {} # no query at all
    - query_param: { "query": "" }
    - query_param: { "query": "zzzqqqxyzzy123" } # matches nothing
  invalid:
    - query_param: { "query": "Batman", "page": -1 }
      expected_message: "Invalid page: Pages start at 1 and max at 500. They are expected to be an integer."
    - query_param: { "query": "Batman", "page": 501 }
      expected_message: "Invalid page: Pages start at 1 and max at 500. They are expected to be an integer."

add_rating:
  defaults:
    valid:
      status_code: 201
      reason: 'Created'
    invalid:
      status_code: 400
      reason: 'Bad Request'
  valid:
    - rating_payload: { "value": "$random_rating" }
    - rating_payload: { "value": "$random_rating" }
  invalid:
    - movie_id: 550
      rating_payload: { "value": "$random_invalid_rating" }
      expected_message: ['Value too high: Value must be less than, or equal to 10.0.',
                         'Value too low: Value must be greater than 0.0.',
                         'Value invalid: Value must be a multiple of 0.50.']
    - movie_id: 680
      rating_payload: { "value": "$random_invalid_rating" }
      expected_message: ['Value too high: Value must be less than, or equal to 10.0.',
                         'Value too low: Value must be greater than 0.0.',
                         'Value invalid: Value must be a multiple of 0.50.']

delete_rating:
  defaults:
    valid:
      status_code: 200
      reason: 'OK'
    invalid:
      status_code: 404
      reason: 'Not Found'
  valid:
    - expected_message: "The item/record was deleted successfully."
  invalid:
    - movie_id: 9999999999
      expected_message: "The resource you requested could not be found."
    - movie_id: 0
      session_id: "$invalid_session_id"
      expected_message: "Invalid id: The pre-requisite id is invalid or not found."

get_person_details:
  defaults:
    valid:
      status_code: 200
      reason: 'OK'
    invalid:
      status_code: 404
      reason: 'Not Found'
  valid:
    - person_id: "$random_person_id"
  invalid:
    - person_id: 0
      expected_message: "Invalid id: The pre-requisite id is invalid or not found."
    - person_id: -1
      expected_message: "Invalid id: The pre-requisite id is invalid or not found."
    - person_id: 9999999999
      expected_message: "The resource you requested could not be found."

update_list:
  defaults:
    valid:
      exp_max_elp_secs: 15  # Overrides the default 5 seconds
      status_code: 201
      reason: 'Created'
    invalid:
      status_code: 404
      reason: 'Not Found'
  valid:
      - list_id: 8637178
        payload: { "name": 'French', "description": "$current_timestamp", "public": true }
        expected_message: "The item/record was updated successfully."
      - list_id: 8637178
        payload: { "name": 'Hollywood', "description": "$current_timestamp", "public": true }
        expected_message: "The item/record was updated successfully."
  invalid:
      - list_id: 9999999999
        payload: { "name": 'Indian', "description": "$current_timestamp", "public": False }
        expected_message: "The resource you requested could not be found."
      - list_id: 0
        payload: { "name": 'Hollywood', "description": "Some random Description", "public": True }
        expected_message: "Invalid id: The pre-requisite id is invalid or not found."